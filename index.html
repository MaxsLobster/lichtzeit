<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lichtzeit – Chiemsee</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:rgba(14,15,22,.72);
  --ink:#ece6d8;
  --ink-soft:rgba(236,230,216,.62);
  --line:rgba(236,230,216,.14);
  --gold:#e8a838;
  --chip:rgba(236,230,216,.08);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:rgba(248,245,238,.82);
    --ink:#1d1f2a;
    --ink-soft:rgba(29,31,42,.62);
    --line:rgba(29,31,42,.14);
    --chip:rgba(29,31,42,.06);
  }
}
:root[data-theme="dark"]{
  --panel:rgba(14,15,22,.72);--ink:#ece6d8;--ink-soft:rgba(236,230,216,.62);--line:rgba(236,230,216,.14);--chip:rgba(236,230,216,.08);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#cd{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:#f1ead9;text-shadow:0 1px 10px rgba(0,0,0,.7);pointer-events:none;transition:opacity .6s;opacity:0}
#cd.on{opacity:1}
#title{position:fixed;top:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;pointer-events:none;transition:opacity .5s}
#title .k{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;line-height:1.05;color:#f1ead9;text-shadow:0 1px 12px rgba(0,0,0,.5)}
#title .s{display:block;font-size:13px;color:rgba(241,234,217,.7);margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,calc(100% - 20px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:20px;padding:12px 14px 10px;transition:opacity .5s, transform .5s}
body.clean #panel{opacity:0;pointer-events:none;transform:translate(-50%,16px)}
body.clean #title{opacity:0}
body.clean{cursor:none}
/* Ausstellungsmodus (Standard): nur das Bild, keine Steuerung, kein Mauszeiger, keine Berührungsgesten. Test-Modus mit ?dev=1 */
body:not(.dev) #panel,body:not(.dev) #title,body:not(.dev) #cd{display:none}
body:not(.dev){cursor:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#fps{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font:600 12px/1.35 Figtree,system-ui,sans-serif;color:#f1ead9;background:rgba(0,0,0,.5);padding:5px 9px;border-radius:8px;pointer-events:none;white-space:pre;text-align:right}
body:not(.dev) #fps{display:none}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-soft);font:600 13px/1 Figtree,system-ui,sans-serif;padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#15161e}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tabs button.on{color:#f8f5ee}}
#readout{font-size:14px;margin:10px 2px 4px;min-height:1.3em}
#readout .cel{color:var(--gold);font-weight:600}
.sl{display:flex;align-items:center;gap:10px;margin:6px 2px;font-size:12px;color:var(--ink-soft)}
.sl span{width:52px;flex:none}
input[type=range]{flex:1;accent-color:var(--gold);height:24px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 13px/1 Figtree,system-ui,sans-serif;padding:9px 11px;border-radius:10px;cursor:pointer}
.row button.on{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:11px;color:var(--ink-soft);margin:8px 2px 0}
</style>
</head>
<body>
<canvas id="c" aria-label="Generatives Kunstwerk, das Uhrzeit und Mondphase zeigt"></canvas>
<div id="title"><span class="k">Lichtzeit</span><span class="s" id="sname">Chiemsee</span></div>
<div id="cd" aria-live="polite"></div>
<div id="fps"></div>
<div id="panel">
  
  <div id="readout"></div>
  <label class="sl"><span>Tag</span><input id="day" type="range" min="-15" max="60" step="1" value="0"></label>
  <label class="sl"><span>Uhrzeit</span><input id="min" type="range" min="0" max="1439" step="1" value="0"></label>
  <div class="row">
    <button id="now" class="on">Jetzt</button>
    <button id="play">Zeitraffer</button>
    <button id="fm">Nächster Vollmond</button>
    <button id="mid">Mitternacht ansehen</button>
    <button id="rare">Seltenheit finden</button>
  </div>
  <div class="hint">Wetter, Tageszeit und Mond verändern das Bild. Die Uhrzeit steht oben links auf der Fallblatt-Tafel, darunter das Wetter der nächsten drei Tage. Zur vollen Stunde und bei besonderen Anlässen schreibt die Tafel ein Wort. Tipp aufs Bild blendet die Steuerung aus.</div>
</div>
<script>
// ---------- Grundlagen ----------
let LAT=47.87, LNG=12.43; // Chiemsee (Standard, config.json kann das ändern)
const rad=Math.PI/180, TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[255*f(0),255*f(8),255*f(4)];}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cd=(a,b)=>{const x=Math.abs(a-b)%1;return Math.min(x,1-x);};
const dayKey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const isMesse=d=>false; // Messetag vorerst deaktiviert
const SYN=29.530588853*864e5, NM0=Date.UTC(2000,0,6,18,14);
const lunation=ts=>Math.floor((ts-NM0)/SYN);
// ---------- Zeit: Lichtzeit rechnet immer in Berliner Zeit, egal welche Zeitzone das Gerät eingestellt hat ----------
const TZ='Europe/Berlin';
let CLOCK_OFF=0,CLOCK_SRC='';          // Korrektur in ms, falls die Geräteuhr stark falsch geht (aus Server-Zeitstempel oder Wetterdaten)
const nowT=()=>Date.now()+CLOCK_OFF;
const TZF=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});
function bParts(T){const o={};for(const p of TZF.formatToParts(T))o[p.type]=+p.value;o.hour%=24;return o;}
// Date, dessen Felder (getHours, getDate …) die Berliner Uhrzeit zum Zeitpunkt T zeigen. Der echte Zeitpunkt steht in .T (für Sonne, Mond, Wetter).
function wall(T){const p=bParts(T),ms=((T%1000)+1000)%1000,off=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-(T-ms);
  let d=new Date(T);if(-d.getTimezoneOffset()*6e4!==off)d=new Date(p.year,p.month-1,p.day,p.hour,p.minute,p.second,ms);
  // Seltener Fall: diese Berliner Uhrzeit gibt es in der Geräte-Zeitzone nicht (deren Sommerzeit-Sprung) – dann die Felder direkt setzen
  if(d.getHours()!==p.hour||d.getDate()!==p.day){d.getHours=()=>p.hour;d.getDate=()=>p.day;d.getMonth=()=>p.month-1;d.getFullYear=()=>p.year;d.getDay=()=>new Date(Date.UTC(p.year,p.month-1,p.day)).getUTCDay();}
  d.T=T;return d;}
// Berliner Uhrzeit -> Zeitpunkt (Monat ab 0; Überlauf wie bei new Date erlaubt)
function fromWall(y,m,d,h=0,mi=0,s=0){const w=Date.UTC(y,m,d,h,mi,s);let T=w;for(let i=0;i<2;i++){const p=bParts(T);T-=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-w;}return T;}
const instant=d=>d.T!==undefined?d.T:d.getTime();
function snowAmt(d){if(d.getMonth()===11){const doy=(d-new Date(d.getFullYear(),0,1))/864e5;return Math.max(0.75,clamp(Math.cos((doy-40)/365*TAU)*1.3-0.25,0,1));}const doy=(d-new Date(d.getFullYear(),0,1))/864e5;return clamp(Math.cos((doy-40)/365*TAU)*1.3-0.25,0,1);}

// ---------- Astronomie (Sonne & Mond) ----------
const J1970=2440588,J2000=2451545,E=rad*23.4397;
const toDays=d=>d.valueOf()/864e5-0.5+J1970-J2000;
const RA=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(E)-Math.tan(b)*Math.sin(E),Math.cos(l));
const DEC=(l,b)=>Math.asin(Math.sin(b)*Math.cos(E)+Math.cos(b)*Math.sin(E)*Math.sin(l));
const AZ=(H,p,d)=>Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(p)-Math.tan(d)*Math.cos(p));
const ALT=(H,p,d)=>Math.asin(Math.sin(p)*Math.sin(d)+Math.cos(p)*Math.cos(d)*Math.cos(H));
const SID=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
function sunC(d){const M=rad*(357.5291+0.98560028*d),C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)),L=M+C+rad*102.9372+Math.PI;return{dec:DEC(L,0),ra:RA(L,0)};}
function moonC(d){const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.22935*d),l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F);return{ra:RA(l,b),dec:DEC(l,b),dist:385001-20905*Math.cos(M)};}
function astro(date){
  const lw=rad*-LNG,phi=rad*LAT,d=toDays(date),s=sunC(d),m=moonC(d),st=SID(d,lw);
  const H=st-s.ra,Hm=st-m.ra;
  const sun={az:AZ(H,phi,s.dec)+Math.PI,alt:ALT(H,phi,s.dec)};
  const moon={az:AZ(Hm,phi,m.dec)+Math.PI,alt:ALT(Hm,phi,m.dec)};
  const sd=149598000,p=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra));
  const inc=Math.atan2(sd*Math.sin(p),m.dist-sd*Math.cos(p));
  const ang=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  return{sun,moon,fraction:(1+Math.cos(inc))/2,phase:0.5+0.5*inc*(ang<0?-1:1)/Math.PI};
}

// ---------- Planeten und Mond im Tierkreis ----------
// Nach Paul Schlyter, "How to compute planetary positions" (Bahnelemente mit Störungstermen, etwa 1–2 Bogenminuten genau,
// geprüft gegen astronomy-engine). dd = Tage seit 31.12.1999 0 Uhr Weltzeit.
const nrm360=x=>((x%360)+360)%360;
const PLANETEN={venus:{N:[76.6799,2.46590e-5],i:[3.3946,2.75e-8],w:[54.8910,1.38374e-5],a:0.723330,e:[0.006773,-1.302e-9],M:[48.0052,1.6021302244]},
  mars:{N:[49.5574,2.11081e-5],i:[1.8497,-1.78e-8],w:[286.5016,2.92961e-5],a:1.523688,e:[0.093405,2.516e-9],M:[18.6021,0.5240207766]},
  jupiter:{N:[100.4542,2.76854e-5],i:[1.3030,-1.557e-7],w:[273.8777,1.64505e-5],a:5.20256,e:[0.048498,4.469e-9],M:[19.8950,0.0830853001]},
  saturn:{N:[113.6634,2.38980e-5],i:[2.4886,-1.081e-7],w:[339.3939,2.97661e-5],a:9.55475,e:[0.055546,-9.499e-9],M:[316.9670,0.0334442282]}};
function kepler(M,e){let E=M+e*Math.sin(M)*(1+e*Math.cos(M));for(let k=0;k<8;k++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;}
function bahn(N,i,w,a,e,M){const E=kepler(M,e),xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
  return{x:r*(Math.cos(N)*Math.cos(v+w)-Math.sin(N)*Math.sin(v+w)*Math.cos(i)),y:r*(Math.sin(N)*Math.cos(v+w)+Math.cos(N)*Math.sin(v+w)*Math.cos(i)),z:r*Math.sin(v+w)*Math.sin(i)};}
const planetM=(k,dd)=>nrm360(PLANETEN[k].M[0]+PLANETEN[k].M[1]*dd);
function planetHelio(k,dd){const p=PLANETEN[k],el=j=>p[j][0]+p[j][1]*dd;let h=bahn(el('N')*rad,el('i')*rad,el('w')*rad,p.a,el('e'),planetM(k,dd)*rad);
  if(k==='jupiter'||k==='saturn'){const Mj=planetM('jupiter',dd)*rad,Ms=planetM('saturn',dd)*rad,s=x=>Math.sin(x*1),c=x=>Math.cos(x*1),g=rad;let dl=0,db=0;
    if(k==='jupiter')dl=-0.332*s(2*Mj-5*Ms-67.6*g)-0.056*s(2*Mj-2*Ms+21*g)+0.042*s(3*Mj-5*Ms+21*g)-0.036*s(Mj-2*Ms)+0.022*c(Mj-Ms)+0.023*s(2*Mj-3*Ms+52*g)-0.016*s(Mj-5*Ms-69*g);
    else{dl=0.812*s(2*Mj-5*Ms-67.6*g)-0.229*c(2*Mj-4*Ms-2*g)+0.119*s(Mj-2*Ms-3*g)+0.046*s(2*Mj-6*Ms-69*g)+0.014*s(Mj-3*Ms+32*g);db=-0.020*c(2*Mj-4*Ms-2*g)+0.018*s(2*Mj-6*Ms-49*g);}
    const r=Math.hypot(h.x,h.y,h.z),lon=Math.atan2(h.y,h.x)+dl*rad,lat=Math.asin(h.z/r)+db*rad;h={x:r*Math.cos(lat)*Math.cos(lon),y:r*Math.cos(lat)*Math.sin(lon),z:r*Math.sin(lat)};}
  return h;}
function sonneGeo(dd){const w=(282.9404+4.70935e-5*dd)*rad,e=0.016709-1.151e-9*dd,M=nrm360(356.0470+0.9856002585*dd)*rad,E=kepler(M,e),xv=Math.cos(E)-e,yv=Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
  return{x:r*Math.cos(v+w),y:r*Math.sin(v+w)};}
// Höhe und Himmelsrichtung eines Planeten über dem Chiemsee (Azimut von Norden über Osten, in Grad)
function planetHimmel(k,T){const dd=T/864e5-10956,h=planetHelio(k,dd),s=sonneGeo(dd),x=h.x+s.x,y=h.y+s.y,z=h.z,ecl=(23.4393-3.563e-7*dd)*rad;
  const ye=y*Math.cos(ecl)-z*Math.sin(ecl),ze=y*Math.sin(ecl)+z*Math.cos(ecl),ra=Math.atan2(ye,x),dec=Math.atan2(ze,Math.hypot(x,ye));
  const d0=toDays(new Date(T)),Hh=rad*(280.46061837+360.98564736629*d0)+rad*LNG-ra,phi=rad*LAT; // genaue mittlere Sternzeit (IAU)
  return{alt:ALT(Hh,phi,dec)/rad,az:nrm360((AZ(Hh,phi,dec)+Math.PI)/rad)};}
// Ekliptikale Länge des Mondes (tropischer Tierkreis, Frühlingspunkt des Datums), in Grad
function mondLaenge(T){const dd=T/864e5-10956,N=nrm360(125.1228-0.0529538083*dd),w=nrm360(318.0634+0.1643573223*dd),Mm=nrm360(115.3654+13.0649929509*dd);
  const m=bahn(N*rad,5.1454*rad,w*rad,60.2666,0.054900,Mm*rad),Ms=nrm360(356.0470+0.9856002585*dd),Ls=Ms+282.9404+4.70935e-5*dd,Lm=Mm+w+N,D=(Lm-Ls)*rad,F=(Lm-N)*rad,mm=Mm*rad,ms=Ms*rad,s=Math.sin;
  return nrm360(Math.atan2(m.y,m.x)/rad-1.274*s(mm-2*D)+0.658*s(2*D)-0.186*s(ms)-0.059*s(2*mm-2*D)-0.057*s(mm-2*D+ms)+0.053*s(mm+2*D)+0.046*s(2*D-ms)+0.041*s(mm-ms)-0.035*s(D)-0.031*s(mm+ms)-0.015*s(2*F-2*D)+0.011*s(mm-4*D));}
const ZEICHEN=['Widder','Stier','Zwillinge','Krebs','Löwe','Jungfrau','Waage','Skorpion','Schütze','Steinbock','Wassermann','Fische'];
// Sonnenzeichen aus dem Geburtstag 'MM-TT' (übliche Grenztage)
function sonnenzeichen(mmdd){if(!mmdd)return -1;const [m,t]=mmdd.split('-').map(Number),v=m*100+t,G=[[120,10],[219,11],[321,0],[420,1],[521,2],[621,3],[723,4],[823,5],[923,6],[1023,7],[1122,8],[1222,9]];
  let z=9;for(const [g,k] of G)if(v>=g)z=k;return z;}
// ---------- Himmel ----------
const SKY=[[-90,'#060a18','#0d1428'],[-18,'#060a18','#0d1428'],[-12,'#0b1430','#1b2646'],[-7,'#17284f','#3e4167'],[-3,'#28416f','#9c6c79'],[0,'#3b5b8b','#e28d5f'],[3,'#4d71a2','#efac6f'],[8,'#5e87b8','#eac99a'],[18,'#6592c2','#dcdcc8'],[35,'#5d8fc6','#d4e0e3'],[90,'#5389c4','#d0dfe7']].map(([a,t,h])=>[a,hex(t),hex(h)]);
function sky(A){
  const a=A.sun.alt/rad;let r;
  for(let i=1;i<SKY.length;i++){if(a<=SKY[i][0]){const p=SKY[i-1],q=SKY[i],u=(a-p[0])/(q[0]-p[0]);r={top:mix(p[1],q[1],u),hor:mix(p[2],q[2],u)};break;}}
  if(!r)r={top:SKY[SKY.length-1][1],hor:SKY[SKY.length-1][2]};
  const night=1-smooth(-14,-4,a), lift=A.fraction*smooth(0,15,A.moon.alt/rad)*night;
  r.top=mix(r.top,[28,44,82],0.4*lift);r.hor=mix(r.hor,[46,60,96],0.4*lift);r.lift=lift;r.night=night;
  return r;
}

// ---------- Canvas ----------
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W,H,DPR,tex,texAq;
function buildTexture(){
  tex=document.createElement('canvas');tex.width=W;tex.height=H;const c=tex.getContext('2d'),r=rng(42);
  c.fillStyle='rgb(128,128,128)';c.fillRect(0,0,W,H);
  const n=Math.round(W*H/170);
  for(let i=0;i<n;i++){const x=r()*W,y=r()*H,l=6+r()*24,a=(r()-0.5)*(y<H*0.58?1.3:0.2),v=r()<0.5?255:0;
    c.strokeStyle=`rgba(${v},${v},${v},${0.04+r()*0.07})`;c.lineWidth=1+r()*2.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}

function F_sky(C){const {t,d,sa,hy,mn,hr,farSc,L,night,S}=C,r=rng(dayKey(d)*41+3),bird=rgba(mix([60,62,70],S.top,0.3*night),0.75);

    for(let i=0;i<7;i++){const x=W*(0.95-0.85*rp)+(i%3)*W*0.03+Math.sin(i*2.1)*W*0.02,y=hy+(rowY-hy)*(0.35+0.08*(i%3))+i*1.5,s=mn*(0.014+0.004*(i%3));sailboat(x,y,s,-1,white,silh,vis,sp[i]);}}}

function F_swans(C){const {t,sa,mn,hr,L}=C;const vis=(smooth(7.5,8.2,hr)*(1-smooth(10.6,11.2,hr))+smooth(15.8,16.4,hr)*(1-smooth(18.8,19.3,hr)))*smooth(-2,4,sa);if(vis<0.01)return;

// ---------- Das Bild malt sich selbst ----------
function edgePts(prog,dir,seed){const pts=[],n=48;
  if(dir==='tb'){const y0=prog*H*1.1-H*0.05;for(let i=0;i<=n;i++){const x=W*i/n;pts.push([x,y0+Math.sin(x*0.015+seed)*H*0.025+Math.sin(x*0.061+seed*2)*H*0.008]);}}
  else{const e=prog*W*1.15-W*0.075,x0=dir==='lr'?e:W-e;for(let i=0;i<=n;i++){const y=H*i/n;pts.push([x0+Math.sin(y*0.012+seed)*W*0.04+Math.sin(y*0.05+seed*3)*W*0.012,y]);}}
  return pts;}
function layer(prog,dir,seed,fn){if(prog<=0)return;if(prog>=1){fn();return;}
  const pts=edgePts(prog,dir,seed);ctx.save();ctx.beginPath();
  if(dir==='tb'){ctx.moveTo(0,0);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(W,0);}
  else if(dir==='lr'){ctx.moveTo(0,0);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(0,H);}
  else{ctx.moveTo(W,0);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(W,H);}
  ctx.closePath();ctx.clip();fn();ctx.restore();
  ctx.strokeStyle='rgba(95,72,50,0.22)';ctx.lineWidth=1.6;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
function sketch(C,a){if(a<0.01)return;const {hy,farSc,midSc,iy}=C;ctx.save();ctx.strokeStyle=`rgba(72,64,56,${a})`;ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(0,hy);ctx.lineTo(W,hy);ctx.stroke();
  for(const [arr,sc] of [[FAR,farSc],[MID,midSc]]){ctx.beginPath();const n=arr.length-1;for(let i=0;i<=n;i+=2)ctx.lineTo(i/n*W,hy-arr[i]*sc);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(W*0.36,iy);ctx.quadraticCurveTo(W*0.415,iy-H*0.035,W*0.47,iy);ctx.stroke();ctx.beginPath();ctx.moveTo(W*0.425,iy);ctx.lineTo(W*0.425,iy-H*0.06);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W*0.6,iy);ctx.quadraticCurveTo(W*0.765,iy-H*0.03,W*0.93,iy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,H*0.93);ctx.quadraticCurveTo(W*0.18,H*0.9,W*0.4,H);ctx.stroke();
  ctx.lineWidth=0.5;for(let i=0;i<14;i++){const y=hy+(H-hy)*(0.1+i*0.06),x=W*((i*0.37)%0.7);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+W*0.2,y);ctx.stroke();}
  ctx.restore();}
function trail(C){const {d,hy,xv,dayMode,v,altY}=C;ctx.save();ctx.fillStyle=dayMode?'rgba(185,120,50,0.4)':'rgba(120,130,160,0.35)';
  if(dayMode){const tr=sunTrack(d);for(let i=36;i<=144&&i/6<=C.hr;i++){const q=i/6-6,x=xv(q),y=altY(tr[i]);if(y<hy)ctx.fillRect(x-1,y-1,2,2);}}
  else{for(let q=0;q<=v;q+=0.1){const x=xv(q),y=hy-(0.18+0.55*Math.sin(Math.PI*q/12))*hy*0.8;ctx.fillRect(x-1,y-1,2,2);}}

  const pSky=P(5.5,7.5),pFar=P(7,9),pMid=P(8.5,10),pLake=P(9.5,11.5),pCl=P(11,13),pShore=P(12.5,14);

// ---------- Seltenheiten, Puls, Glocken ----------
const WT=['klar','heiter','wechselhaft','gewittrig','Regen'];
function wtypeOf(d){const r=rng(dayKey(d)*29+7),u=r();let w=u<0.18?0:u<0.5?1:u<0.75?2:u<0.9?3:4;if(w===3&&(d.getMonth()<4||d.getMonth()>8))w=2;return w;}
function dayRare(d){const m=d.getMonth(),dd=d.getDate(),dow=d.getDay(),u=rng(dayKey(d)*53+19)(),ev=[];
  if(m===5&&dd>=20&&dd<=22)ev.push({k:'sonnwend',n:'Sonnwendfeuer',a:21.5,b:25});
  if(m===7&&dd>=11&&dd<=13)ev.push({k:'meteor',n:'Perseiden',a:22,b:28});
  if(m===11)ev.push({k:'advent',n:'Weihnachtslichter',a:16,b:22.5});
  if(u<0.08)ev.push({k:'halo',n:'Sonnenhalo',a:10,b:15,r:1});
  else if(u<0.12)ev.push({k:'aurora',n:'Nordlicht',a:22,b:26,r:1});
  else if(u<0.16)ev.push(m>=5&&m<=7?{k:'fire',n:'Seefest-Feuerwerk',a:22,b:22.25,r:1}:{k:'glut',n:'Glühender Abend',a:17,b:21,r:1});
  else if(u<0.19)ev.push({k:'glut',n:'Glühender Abend',a:17,b:21,r:1});
  else if(u<0.2&&(m===0||m===1))ev.push({k:'ice',n:'Eis auf dem See',a:0,b:24,r:1});
  return ev;}
function activeRare(d){const hr=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600,out={};
  const add=(ev,h)=>{if(h>=ev.a&&h<ev.b){const f=smooth(ev.a,ev.a+0.12,h)*(1-smooth(ev.b-0.12,ev.b,h));out[ev.k]=Math.max(out[ev.k]||0,f);}};
  for(const ev of dayRare(d))add(ev,hr);const p=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);for(const ev of dayRare(p))add(ev,hr+24);return out;}
const breath=t=>0.5+0.5*Math.sin(t*TAU/6);
function P_grid(C){const {t,hy,lx,dayMode,sunY,moonY,S,night,mn}=C,sy=dayMode?Math.min(sunY,hy):moonY,g=Math.round(clamp(mn/30,10,24)),col=mix(S.hor,[255,255,255],0.55);

// ---------- Astro-Ebene: Planeten, Mond im Tierkreis, Punkte auf dem Bergkamm ----------
// Dezent: je eine Rasterzelle, dunkler als Uhr und Strahl. Keine Beschriftung im Bild (nur in der Info-Zeile bei ?dev=1).
let ASTRO_AN={planeten:true,mond:true,kamm:false},KAMM=[]; // Kamm-Punkte seit der Fallblatt-Uhr aus (config.json kann sie wieder einschalten)

const RICHTUNG8=az=>['N','NO','O','SO','S','SW','W','NW'][Math.round(az/45)%8];
function astroLayer(C,cs,t){const T=instant(C.d),{hy,night,sa,farSc}=C,snap=x=>Math.floor(x/cs)*cs;

  ASTRO.planeten=[];if(ASTRO_AN.planeten)for(const k in PL_SICHT){const p=planetHimmel(k,T),v=PL_SICHT[k],fx=(p.az-90)/180;p.k=k;p.sicht=false;ASTRO.planeten.push(p);

// ---------- Besucher: Eisvogel und Feuerwehrboot, Dezember ----------

let FW={von:14*60,bis:19*60,min:5},KF={n:3,min:5};
function visitorTimes(d){const r=rng(dayKey(d)*61+5),ev=[];
  const fw=FW.von+Math.floor(r()*(FW.bis-FW.von-FW.min));
  const kf=[];let guard=0;while(kf.length<KF.n&&guard++<Math.max(50,KF.n*15)){const m=7*60+Math.floor(r()*(12*60-KF.min));if(kf.every(x=>Math.abs(x-m)>Math.max(30,KF.min)))kf.push(m);}kf.sort((a,b)=>a-b);

function extrasLayer(C,cs,t){const {d,sa,hy,night,L,S,iy,rowY,pc}=C,snap=x=>Math.floor(x/cs)*cs,m=d.getHours()*60+d.getMinutes(),sec=d.getSeconds()+d.getMilliseconds()/1000;

  for(const k of V.kf){if(m<k||m>=k+KF.min)continue;const e=(m-k)*60+sec,x=snap(W*0.2),y=snap(H*0.905),blue=[40,150,225],org=[235,130,50],dk=[30,30,36],eEnd=KF.min*60-2;

    for(let i=-5;i<=5;i++)px(x+i*cs,y,red);for(let i=-4;i<=4;i++)px(x+i*cs,y+cs,mix(red,[0,0,0],0.3));
    for(let i=-1;i<=3;i++)px(x+i*cs,y-cs,wh);px(x,y-2*cs,wh);px(x+cs,y-2*cs,wh);
    px(x,y-3*cs,blink?[60,120,255]:[20,30,70]);px(x+cs,y-3*cs,blink?[20,30,70]:[60,120,255]);
    if(blink){ctx.save();ctx.globalCompositeOperation='lighter';softEllipse(x+cs,y-3*cs,cs*4,cs*4,[60,120,255],0.35);ctx.restore();}
    if(e>FW.min*20&&e<FW.min*36){for(let k=1;k<=7;k++){const sx=x-(3+k)*cs,sy=y-2*cs-Math.round(Math.sin(k/7*Math.PI)*3)*cs;px(sx,sy,[230,240,255],0.7*(0.6+0.4*Math.sin(t*10+k)));}
      // Scheint die Sonne (nicht bei bedeckt), steht ein kleiner Regenbogen in der Fontäne

// ---------- Entdecken: kleine Szenen ----------
// Winzige Szenen im Pixelstil, damit man bei jedem Blick etwas Kleines findet. Immer mindestens eine, nie mehr als zwei, jede 3 bis 10 Minuten.
// Der Ablauf ist pro Tag fest (wie Eisvogel und Feuerwehrboot), aber jeden Tag anders: eine lückenlose Kette von Hauptszenen plus gelegentlich
// eine zweite. Jede hat eine Kandidatenliste; gezeigt wird der erste Kandidat, der gerade passt (Jahreszeit, Licht, Wetter, Platz neben dem Strahl).
// Die Szenen liegen unter Uhr und Dampfer, Zellen im Strahl, an der Sonnen- bzw. Mondscheibe, an den Pfählen und am Dampfer werden ausgelassen.
let ENTDECKEN=true;
const SZ_NAME={angler:'Angler im Schilf',reiher:'Graureiher im Flachwasser',ruderboot:'Ruderboot im Nebel',flugzeug:'Flugzeug mit Kondensstreifen',sup:'Stand-up-Paddler',enten:'Entenfamilie',
  fledermaus:'Fledermäuse',spaziergang:'Spaziergänger mit Hund',heimfahrt:'Boote fahren heim',autos:'Autoscheinwerfer am fernen Ufer',satellit:'Satellit',kahn:'Kahn mit Laterne'};
const SZ_POOL={morgen:['angler','reiher','ruderboot'],tag:['flugzeug','sup','enten'],abend:['fledermaus','spaziergang','heimfahrt'],nacht:['autos','satellit','kahn']};
const szSaison=(k,mo)=>!(k==='sup'&&(mo<4||mo>8))&&!(k==='fledermaus'&&(mo<3||mo>9)); // Paddler Mai bis September, Fledermäuse April bis Oktober
const SZ_PLAENE=new Map();
// Tagesplan (Minuten seit Mitternacht, Berliner Zeit). Tageszeit nach Sonnenstand: Nacht unter −8°, Morgen bis 10 Uhr, Abend ab 8° am Nachmittag.
function szPlan(d){const key=dayKey(d);let P=SZ_PLAENE.get(key);if(P)return P;
  const y=d.getFullYear(),mo=d.getMonth(),da=d.getDate(),r=rng(key*71+13),sonne=m=>astro(new Date(fromWall(y,mo,da,0,m))).sun.alt/rad;
  const zeit=(m,s)=>s<-8?'nacht':m<12*60?(m<10*60?'morgen':'tag'):s<8?'abend':'tag';
  const misch=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const slot=(a,b,vorher)=>{const s=sonne((a+b)/2),z=zeit((a+b)/2,s),kand=misch(SZ_POOL[z].filter(k=>szSaison(k,mo)));if(kand[0]===vorher&&kand.length>1)kand.push(kand.shift());
    return{a,b,kand,z,sa:s,seed:Math.floor(r()*1e9)};};
  const haupt=[],neben=[];let t=0,vorher='';
  while(t<1440){const rest=1440-t;let dur=3+Math.floor(r()*8);if(rest-dur<3&&rest!==dur)dur=rest<=10?rest:rest-3;const s=slot(t,t+dur,vorher);haupt.push(s);vorher=s.kand[0];t+=dur;}
  let frei=0;for(const h of haupt){if(h.a<frei||r()>0.3)continue;const dur=3+Math.floor(r()*8),a=h.a+Math.floor(r()*(h.b-h.a));if(a+dur>1440)continue;const s=slot(a,a+dur,h.kand[0]);s.neben=true;neben.push(s);frei=a+dur;}
  P={haupt,neben};if(SZ_PLAENE.size>4)SZ_PLAENE.delete(SZ_PLAENE.keys().next().value);SZ_PLAENE.set(key,P);return P;}
// Wo der Strahl zu einer Uhrzeit steht (Anteil der Breite), wie breit er auf Höhe y ist (halbe Breite in Bildpunkten), Uferlinie vorne links (wie L_shore)
const szLx=m=>{const hr=m/60,v=hr>=6&&hr<18?hr-6:(hr-18+24)%24;return 0.07+v/12*0.86;};
const szStrahl=(hy,y,cs)=>{if(y<=hy)return 0;const u=Math.pow(clamp((y-hy)/((H-hy)*0.95),0,1),1/1.3);return (3+30*u*u)*(W/700+0.4*cs);};
const uferY=fx=>{const t=(-0.36+Math.sqrt(0.1296+0.16*clamp(fx,0,0.4)))/0.08;return (1-t)*(1-t)*0.93+2*t*(1-t)*0.9+t*t;};
// Freie Abschnitte zwischen x0 und x1 auf Höhe y, ohne den Strahl zu Beginn und am Ende der Szene (am Himmel: ohne die Spalte über Sonne bzw. Mond)
function szLuecken(C,y,x0,x1,s,rand,cs){let L=[[x0,x1]];const cut=(a,b)=>{const n=[];for(const [p,q] of L){if(b<=p||a>=q){n.push([p,q]);continue;}if(a>p)n.push([p,a]);if(b<q)n.push([b,q]);}L=n;};

const szLaengste=L=>L.reduce((b,q)=>q[1]-q[0]>b[1]-b[0]?q:b,[0,0]);
// Platz und feste Zufallswerte einer Szene, einmal je Szene berechnet. null = kein Platz (dann kommt der nächste Kandidat).
const SZ_ANKER=new Map();
function szAnker(k,s,C,cs){const key=s.seed+'|'+k+'|'+W+'|'+H;if(SZ_ANKER.has(key))return SZ_ANKER.get(key);
  const r=rng(s.seed^0x5bd1),hy=C.hy,F=H-hy,m=6*cs,A={r:[]};for(let i=0;i<24;i++)A.r.push(r());let ok=true;

  else if(k==='spaziergang'){const q=szLaengste(szLuecken(C,0.95*H,0.02*W,0.37*W,s,m,cs));if(q[1]-q[0]<0.12*W)ok=false;else{A.dir=A.r[0]<0.5?1:-1;A.x0=A.dir>0?q[0]:q[1];A.x1=A.dir>0?q[1]:q[0];}}
  else if(k==='fledermaus'){const L=szLuecken(C,0.4*H,0.12*W,0.88*W,s,0.08*W,cs).filter(q=>q[1]-q[0]>0.02*W);if(!L.length)ok=false;else{const q=L[Math.floor(A.r[3]*L.length)];A.x=lerp(q[0],q[1],A.r[4]);A.y=(0.34+0.1*A.r[5])*H;}}
  else if(k==='heimfahrt'){A.dir=szLx(s.a)>0.5?-1:1;A.boote=[];const n=2+Math.floor(A.r[3]*2),D=(s.b-s.a)*60;

function sortStabil(key,idx,h,n){for(let j=0;j<n;j++)idx[j]=j;let a1=idx,a2=h;
  for(let w=1;w<n;w*=2){for(let lo=0;lo<n;lo+=2*w){const mid=Math.min(lo+w,n),hi=Math.min(lo+2*w,n);let a=lo,b=mid,k=lo;
      while(a<mid&&b<hi){if(key[a1[b]]<key[a1[a]])a2[k++]=a1[b++];else a2[k++]=a1[a++];}while(a<mid)a2[k++]=a1[a++];while(b<hi)a2[k++]=a1[b++];}const x=a1;a1=a2;a2=x;}
  if(a1!==idx)for(let j=0;j<n;j++)idx[j]=a1[j];}

  if(i<3)return 0;const vor=(D[i-1].max+D[i-2].max+D[i-3].max)/3,waerme=Math.max(o.temp,D[i].max)-vor;o.foehnWarm=waerme;
  const r=o.wd>=FOEHN.richtung_von&&o.wd<=FOEHN.richtung_bis?1:0,sicht=o.vis!==null?smooth(FOEHN.sicht_ab*0.8,FOEHN.sicht_ab,o.vis):(o.low===null?1:1-smooth(FOEHN.fenster_tief_bis,FOEHN.fenster_tief_bis+30,o.low))*(o.mm!==null&&o.mm>0.1?0:1);
  return r*smooth(FOEHN.boeen_ab-5,FOEHN.boeen_ab+5,o.gust)*(1-smooth(FOEHN.feuchte_bis-5,FOEHN.feuchte_bis+5,o.rh))*smooth(FOEHN.waermer_um-1,FOEHN.waermer_um+1,waerme)*sicht;}
// Druck-Trend, Unruhe des Rasters und See-Farbton
function wxExtras(o){const dp=o.dp;
  o.trend=dp===null?'':dp>BARO.steigt?'steigend':dp<BARO.stark?'stark fallend':dp<BARO.faellt?'fallend':'stabil';
  o.baro=dp===null?0:BARO.unruhe*smooth(-BARO.faellt,0.5-BARO.faellt,-dp)+(BARO.sturm-BARO.unruhe)*smooth(-BARO.stark,0.5-BARO.stark,-dp)-BARO.ruhe*smooth(BARO.steigt,BARO.steigt+0.5,dp);
  o.tempK=o.temp===null?0:clamp((o.temp-(SEE_TEMP.kalt+SEE_TEMP.warm)/2)/((SEE_TEMP.warm-SEE_TEMP.kalt)/2),-1,1);
  return o;}
// Wetter erzwingen (Test): ?wetter=gewitter|regen|nebel|klar|schnee|bedeckt|hochnebel – feste Werte mit typischem Luftdruck-Trend
const WX_PRESETS={bedeckt:{code:3,cloud:100,low:70,mid:90,high:60,wind:8,temp:9,p:1012,vis:15000,dp:0},hochnebel:{code:3,cloud:100,low:100,mid:0,high:0,wind:3,temp:4,p:1031,vis:12000,dp:1.6},klar:{code:0,cloud:0,wind:6,temp:18,p:1022,vis:40000,dp:0},gewitter:{code:95,cloud:95,rain:6,wind:30,temp:22,p:1006,vis:15000,dp:-3.5},
  regen:{code:63,cloud:100,rain:3,wind:15,temp:10,p:1008,vis:8000,dp:-1.5},nebel:{code:45,cloud:90,wind:2,temp:6,p:1024,vis:300,dp:0},schnee:{code:73,cloud:100,snow:1.2,wind:8,temp:-2,p:1012,vis:3000,dp:0},
  sturm:{code:3,cloud:80,low:50,mid:70,high:60,wind:58,gust:90,temp:11,p:999,vis:15000,dp:-2.5},regenbogen:{code:2,cloud:45,low:30,mid:30,high:20,wind:8,temp:17,p:1014,vis:30000,dp:0.5,bow:1}};
const WX_FORCE=(()=>{const k=(Q.get('wetter')||'').trim().toLowerCase(),x=WX_PRESETS[k];if(!k)return null;if(!x){URL_INFO.push('?wetter='+k+' unbekannt');return null;}
  const o=wxDerive({t:0,code:x.code,cloud:x.cloud,low:x.low===undefined?x.cloud:x.low,mid:x.mid===undefined?x.cloud:x.mid,high:x.high===undefined?x.cloud:x.high,pr:null,rain:x.rain||0,sh:0,snow:x.snow||0,wind:x.wind,gust:x.gust===undefined?null:x.gust,temp:x.temp,p:x.p,vis:x.vis},1);o.dp=x.dp;o.bow=x.bow||0;o.name=k;return wxExtras(o);})();
function wxAt(ts){if(ts!==WXM.ts){WXM.ts=ts;WXM.v=wxCalc(ts);}return WXM.v;}
function wxText(d){const w=wxAt(instant(d)),f=(v,n=0)=>v===null?'?':v.toFixed(n).replace('.',',');
  if(!w)return 'Wetter: '+WT[wtypeOf(d)]+' (simuliert'+(!WETTER.echt?', echtes Wetter aus':WX_ERR?', '+WX_ERR:'')+')';
  const name=w.wtype===3?'Gewitter':w.sturm>0.5?'Sturm':w.snow>0.05?'Schnee':w.rain>0.05?'Regen':(w.code===45||w.code===48||w.mist>0.4)?'Nebel':w.hn>0.5?'Hochnebel':w.bedeckt>0.5?'bedeckt':WT[w.wtype];
  return (WX_FORCE?'Wetter (erzwungen mit ?wetter='+WX_FORCE.name+')':'Wetter (echt, '+wName()+', Stand '+new Date(WX.fetched+CLOCK_OFF).toLocaleTimeString('de-DE',{timeZone:TZ,hour:'2-digit',minute:'2-digit'})+(WX_ERR?', '+WX_ERR:'')+')')+': '+name+', '+f(w.temp)+' °C, Wolken '+f(w.cloud)+' %'+(w.low!==null&&w.low!==undefined?' (tief '+f(w.low)+' %, mittel '+f(w.oben)+' %)':'')+', '+(w.mm>0.05?'Niederschlag '+f(w.mm,1)+' mm/h, ':'')+'Wind '+f(w.kmh)+' km/h'+(w.gust!==null&&w.gust!==undefined?' (Böen '+f(w.gust)+')':'')+', Sicht '+(w.vis!==null?f(w.vis/1000)+' km':'fehlt (Nebel aus Feuchte '+f(w.rh)+' %)')+', Luftdruck '+f(w.p)+' hPa'+(w.dp!==null?', '+w.trend+' ('+(w.dp>0?'+':'')+f(w.dp,1)+' hPa in '+BARO.stunden+' h)':'');}
function wxLoad(){try{const c=JSON.parse(localStorage.getItem(WX_KEY)||'null');if(c&&c.lat===wLat()&&c.lng===wLng()&&c.j){WX={fetched:c.fetched,lat:wLat(),lng:wLng(),S:wxBuild(c.j),D:wxTage(c.j)};WXM.ts=NaN;}}catch(e){}}
function wxFetch(){if(!WETTER.echt)return Promise.resolve();let tm=0;
  const done=()=>{clearTimeout(tm);setTimeout(wxFetch,(WX_ERR?Math.min(5,WETTER.min):WETTER.min)*6e4);},fail=e=>{WX_ERR='Abruf fehlgeschlagen: '+(e.name==='AbortError'?'Zeitüberschreitung':e instanceof TypeError?'keine Verbindung':e.message);console.warn(WX_ERR);};
  try{const ctl=window.AbortController?new AbortController():null;tm=setTimeout(()=>{if(ctl)ctl.abort();},15000);
    const url='https://api.open-meteo.com/v1/forecast?latitude='+wLat()+'&longitude='+wLng()+'&current='+WX_VARS+'&hourly='+WX_VARS+'&daily='+WX_TAGE+'&past_hours=24&forecast_hours=24&past_days=7&forecast_days=4&timezone=Europe%2FBerlin&timeformat=unixtime';
    return fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(j=>{const S=wxBuild(j),now=Date.now();WX={fetched:now,lat:wLat(),lng:wLng(),S,D:wxTage(j)};WXM.ts=NaN;WX_ERR='';
        // Ohne Server-Zeitstempel: grobe Uhrprüfung über den 15-Minuten-Zeitpunkt der Wetterdaten (nur bei mehr als 20 min Abweichung)
        const ct=j.current&&j.current.time;if(CLOCK_SRC!=='Server'&&typeof ct==='number'){const off=ct*1000+450e3-now;if(Math.abs(off)>20*6e4){CLOCK_OFF=off;CLOCK_SRC='Wetterdaten';}}try{localStorage.setItem(WX_KEY,JSON.stringify({fetched:now,lat:wLat(),lng:wLng(),j}));}catch(e){}})
      .catch(fail).then(done);}
  catch(e){fail(e);done();return Promise.resolve();}}

// Die Adresse überschreibt die Anzeige-Einstellungen nur für dieses Gerät: ?raster=6&fps=30&aufloesung=0.5 (jeweils auch "auto"), ?gpu=0 oder 1
function urlAnzeige(){const set=(k,key,p,auto)=>{const v=Q.get(k);if(v===null)return;const t=v.trim().toLowerCase(),x=t==='auto'?auto:p(+t.replace(',','.'));
    if(x===null||t==='')URL_INFO.push('?'+k+'='+v+' ungültig');else{ANZ[key]=x;if(t==='auto')delete ANZ_SRC[key];else ANZ_SRC[key]='Adresse';}};
  set('raster','raster_px',pZahl(2,40),0);set('fps','max_fps',pZahl(5,120),30);set('aufloesung','aufl',pZahl(0.25,1),0);
  const ls=Q.get('lesen');if(ls!==null){if(['webgl','cpu','auto','async'].includes(ls)){LESEN.wunsch=ls;if(ls!=='auto'&&ls!=='async'){LESEN.jetzt=ls;LESEN.fertig=true;}}else URL_INFO.push('?lesen='+ls+' ungültig');}
  const g=Q.get('gpu');if(g!==null){if(['0','1','aus','an'].includes(g))GPU_WUNSCH=g==='1'||g==='an';else URL_INFO.push('?gpu='+g+' ungültig');}
  const sz=Q.get('szene');if(sz!==null){if(['halb','voll','auto'].includes(sz))SZENE_HALB_WUNSCH=sz;else URL_INFO.push('?szene='+sz+' ungültig');}
  // Test-Parameter für die neuen Momente (?vorhersage= wird schon beim Laden gelesen)
  const wa=Q.get('warn');if(wa!==null){if(['0','1','2'].includes(wa))WARN_TEST=+wa;else URL_INFO.push('?warn='+wa+' ungültig');}
  const sn=Q.get('schnee');if(sn!==null){if(['1','2','3','4'].includes(sn))SCHNEE_TEST=+sn;else URL_INFO.push('?schnee='+sn+' ungültig');}
  if(Q.get('eis')==='1')EIS_TEST=true;if(Q.get('foehn')==='1')FOEHN_TEST=true;if(Q.get('markt')==='1')MARKT_TEST=true;
  const tf=Q.get('tafel');if(tf)TAFEL_TEST={text:tf.toUpperCase()};
  const en=Q.get('entdecken');if(en!==null){if(['0','1','aus','an'].includes(en))ENTDECKEN=en==='1'||en==='an';else URL_INFO.push('?entdecken='+en+' ungültig');}}
function start(){if(started)return;started=true;urlAnzeige();if(ANZ.raster_px||ANZ.aufl)resize();$('sname').textContent=ORT;document.title='Lichtzeit – '+ORT;toSliders(curT());setMode();keepAwake();requestAnimationFrame(frame);}
// Start: erst die Einstellungen, dann das Wetter (gespeicherter Stand sofort, neuen Abruf höchstens 3 s abwarten)
function boot(){if(WX_FORCE)return null;wxLoad();const f=wxFetch();return WX&&wxAt(nowT())?null:Promise.race([f,new Promise(r=>setTimeout(r,3000))]);}
setTimeout(start,8000); // Sicherheitsnetz: das Bild startet auf jeden Fall
try{loadConfig().then(boot).then(start,start);}catch(e){start();}
</script>
