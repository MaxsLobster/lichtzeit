<canvas id="c" width="1080" height="1800"></canvas>
<script>
// Lichtzeit – Inntal: Blick vom Wildbarren nach Südosten, das Tal diagonal hinunter bis zum Kaiser.
// Die Uhr ist das Licht: Schatten von Häusern, Bäumen und Bergen folgen dem echten Sonnenstand.
// Weltkoordinaten: E = Osten, N = Norden, h = Höhe (künstlerischer Maßstab, Gebäude bewusst groß).
const W=1080,H=1800,LAT=47.65,LON=12.17,rad=Math.PI/180,TAU=Math.PI*2;
const cv=document.getElementById('c');let ctx=cv.getContext('2d'); // ctx zeigt beim Aufbau der Zwischenbilder kurz auf deren Zeichenfläche
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px';}addEventListener('resize',fit);fit();
const Q=new URLSearchParams(location.search);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rng(s){let x=(s|0)^0x9e3779b9;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%1e6)/1e6;};}

// ---------- Kamera: vom Wildbarren nach Südosten, leicht nach unten geneigt ----------
const CAM={E:-720,N:760,H:360},AZ=135*rad,PITCH=12*rad,FOC=1150,CX=540,CY=760;
const F3=[Math.sin(AZ)*Math.cos(PITCH),Math.cos(AZ)*Math.cos(PITCH),-Math.sin(PITCH)],R3=[Math.sin(AZ+Math.PI/2),Math.cos(AZ+Math.PI/2),0];
const U3=[R3[1]*F3[2]-R3[2]*F3[1],R3[2]*F3[0]-R3[0]*F3[2],R3[0]*F3[1]-R3[1]*F3[0]];
function pr(E,N,h=0){const x=E-CAM.E,y=N-CAM.N,z=h-CAM.H,cz=x*F3[0]+y*F3[1]+z*F3[2],cx=x*R3[0]+y*R3[1]+z*R3[2],cy=x*U3[0]+y*U3[1]+z*U3[2];const d=Math.max(cz,1);return [CX+FOC*cx/d,CY-FOC*cy/d,cz];}
const tief=(E,N,h=0)=>(E-CAM.E)*F3[0]+(N-CAM.N)*F3[1]+(h-CAM.H)*F3[2];
const sicht=(n,c)=>n[0]*(CAM.E-c[0])+n[1]*(CAM.N-c[1])+n[2]*(CAM.H-c[2])>0;
function poly(pts,col,naht){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=col;ctx.fill();if(naht){ctx.strokeStyle=col;ctx.lineWidth=1.1;ctx.lineJoin='round';ctx.stroke();}}
const polyW=(pts,col,naht)=>{if(pts.some(p=>tief(p[0],p[1],p[2]||0)<15))return;poly(pts.map(p=>pr(p[0],p[1],p[2]||0)),col,naht);};

// ---------- Sonne ----------
function sonne(t){const d=t/864e5-10957.5,g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d,L=(q+1.915*Math.sin(g)+0.02*Math.sin(2*g))*rad,e=(23.439-3.6e-7*d)*rad;
  const RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec=Math.asin(Math.sin(e)*Math.sin(L)),gmst=((18.697374558+24.06570982441908*d)%24)*15,Hh=(gmst+LON)*rad-RA,ph=LAT*rad;
  const alt=Math.asin(Math.sin(ph)*Math.sin(dec)+Math.cos(ph)*Math.cos(dec)*Math.cos(Hh)),az=Math.atan2(Math.sin(Hh),Math.cos(Hh)*Math.sin(ph)-Math.tan(dec)*Math.cos(ph))+Math.PI;
  return {alt:alt/rad,az:az/rad,E:Math.sin(az)*Math.cos(alt),N:Math.cos(az)*Math.cos(alt),U:Math.sin(alt)};}

// ---------- Zeit und Wetter (Vorschau: simulierbar) ----------
// Alles rechnet in Berliner Zeit, egal welche Zeitzone das Gerät hat. berlin(t) liefert ein Date, dessen Felder (getHours …) die Berliner Uhrzeit zeigen.
const BZ=(()=>{try{return new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Berlin',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'});}catch(e){return null;}})(),BZ_M={k:NaN,off:0};
function bzVers(t){const k=Math.floor(t/36e5);if(BZ_M.k!==k){BZ_M.k=k;let off=0;if(BZ){const p={};for(const x of BZ.formatToParts(new Date(k*36e5)))p[x.type]=+x.value;off=new Date(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second).getTime()-k*36e5;}BZ_M.off=off;}return BZ_M.off;}
const berlin=t=>new Date(t+bzVers(t));
// ?t=2027-07-10T11:05:20 (Berliner Zeit) oder ?t=11:05 (heute)
const parseT=s=>{let m=/^(\d{4})-(\d\d)-(\d\d)[T ](\d\d?):(\d\d)(?::(\d\d))?$/.exec(s||''),y,mo,d,h,mi,se;if(m){[y,mo,d,h,mi,se]=[+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];}
  else{m=/^(\d\d?):(\d\d)(?::(\d\d))?$/.exec(s||'');if(!m)return null;const b=berlin(Date.now());[y,mo,d,h,mi,se]=[b.getFullYear(),b.getMonth(),b.getDate(),+m[1],+m[2],+(m[3]||0)];}
  const lok=new Date(y,mo,d,h,mi,se).getTime();let t=lok-bzVers(lok);t=lok-bzVers(t);return t;};
// Geräteuhr prüfen: weicht sie mehr als eine Minute vom Server-Zeitstempel ab, gilt die Serverzeit (wie Lichtzeit)
let UHR_KORR=0;function uhrPruefen(){const t0=Date.now();fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}).then(r=>{const s=Date.parse(r.headers.get('Date')||''),t1=Date.now();if(isNaN(s))return;const off=s+500-(t0+t1)/2;UHR_KORR=Math.abs(off)>6e4?off:0;}).catch(()=>{});}
uhrPruefen();setInterval(uhrPruefen,36e5);
const echtJetzt=()=>Date.now()+UHR_KORR;
const T_Q=Q.get('t');let SIM=T_Q&&parseT(T_Q)!==null?{at:parseT(T_Q),dev:Date.now(),k:clamp(+(Q.get('tempo')||1)||1,0.01,5000)}:null,WETTER=Q.get('wetter')||'klar';
// Zeitraffer der Testleiste läuft in einer Schleife über einen Tag (schleife = Länge des Tages, tag0 = 0:00)
const jetzt=()=>{if(!SIM)return echtJetzt();const v=(Date.now()-SIM.dev)*SIM.k;return SIM.schleife?SIM.tag0+(SIM.at-SIM.tag0+v)%SIM.schleife:SIM.at+v;};
const SIM_URL=SIM; // Zeit aus der Adresse (?t=, ?tempo=); nur sie hält den Tageswechsel an, die Testleiste nicht

// ---------- Farben ----------
const F={wiese:[160,154,90],oliv:[128,124,68],sand:[220,192,134],feld:[200,180,112],weg:[218,212,196],asphalt:[176,174,168],schotter:[150,140,124],wasser:[128,160,172],kies:[206,198,180],
  wand:[238,234,224],wand2:[226,220,206],dachG:[118,120,126],dachD:[88,90,96],dachR:[176,110,84],baum:[98,106,56],fichte:[60,78,52],fels:[190,184,172],bergwald:[70,88,60],schnee:[240,242,246],
  gelb:[228,196,112],kloDach:[178,96,70],schwarz:[44,46,52]};

// ---------- Landschaft ----------
const innE=N=>{const a=124+46*Math.sin(N/340+0.5)+14*Math.sin(N/130+1),k=smooth(-480,-960,N);return a+(105-a)*k;},INN_B=21; // biegt hinten nach Kufstein ab
const a93E=N=>Math.min(innE(N)-36,108+10*Math.sin(N/600)),bahnE=N=>{const a=-150+12*Math.sin(N/350);return a+(28-a)*smooth(-420,-960,N);};
const westFuss=N=>(N>327?-470-(N-327)*0.24:-470+(327-N)/1287*470)+18*Math.sin(N/150); // Fuß der Bergflanke rechts
const waldRand=N=>westFuss(N)+12+70*Math.max(0,0.7*Math.sin(N/120+0.4)+0.5*Math.sin(N/47+2)+0.1); // Waldsaum am Fuß der Flanke, mit Zungen ins Tal
const rau=(E,N)=>0.55*Math.sin(E/47+N/61+0.3)+0.3*Math.sin(E/19-N/27+1.7)+0.15*Math.sin(E/9+N/11);
const zahmFuss=E=>E<200?-1500:-960+(E-200)*0.6+22*Math.sin(E/110); // links davon die Lücke Richtung Kufstein
const ostFuss=N=>318+42*Math.sin(N/250+1)+14*Math.sin(N/90); // Fuß der Erler Berge (geschwungen)
// Wo stehen Dörfer und Gebäude? Dort keine Felder.
const DORF=[[-90,70,-90,40],[-200,40,-360,-140],[200,420,-640,-380],[-60,60,-860,-560]]; // [E0,E1,N0,N1]
const inDorf=(E,N)=>DORF.some(d=>E>d[0]&&E<d[1]&&N>d[2]&&N<d[3]);
const FELDER=[];{const r=rng(11);for(let N=900;N>-1140;){const L=60+r()*110;for(let E=-860;E<470;){const D=36+r()*56,E2=E+D,em=(E+E2)/2,nm=N-L/2;
  const frei=!inDorf(em,nm)&&Math.abs(em-innE(nm))>INN_B+22&&Math.abs(em-a93E(nm))>22&&Math.abs(em-bahnE(nm))>14&&E2<ostFuss(nm)-6&&E>waldRand(nm)+4&&N-L>zahmFuss(E2)+12;
  if(frei){const j=()=>(r()-0.5)*18;FELDER.push({q:[[E+2+j(),N-2+j()],[E2-2+j(),N-2+j()],[E2-2+j(),N-L+2+j()],[E+2+j(),N-L+2+j()]],typ:Math.floor(r()*4),quer:r()<0.4,n:3+Math.floor(r()*4)});}E=E2;}N-=L;}}
const FEST={E:180,N:-1070,rE:50,rN:78,H:60};
// Häuser: allgemeine Höfe und Dorfhäuser
const HAEUSER=[];
function haus(E,N,r,k=1,o={}){k*=0.6;HAEUSER.push(Object.assign({E,N,w:(30+r()*16)*k,d:(22+r()*8)*k,h:(12+r()*5)*k,rh:(9+r()*4)*k,rot:(r()<0.5?0:Math.PI/2)+(r()-0.5)*0.1,dach:r()<0.25?F.dachR:r()<0.5?F.dachD:F.dachG,wand:r()<0.5?F.wand:F.wand2,licht:r(),form:'sattel'},o));}
{const r=rng(77);const frei=(E,N,m)=>!HAEUSER.some(h=>Math.hypot(h.E-E,h.N-N)<m);
  // Reisach-Landmarks
  HAEUSER.push({E:0,N:0,w:44,d:30,h:17,rh:12,rot:0,dach:[168,96,72],wand:[240,236,226],licht:0.2,form:'sattel',balkon:true,name:'waller'});
  HAEUSER.push({E:46,N:4,w:26,d:26,h:24,rh:15,rot:0,dach:[78,80,86],wand:[236,232,222],licht:0.1,form:'walm',name:'altesSchloss'});
  HAEUSER.push({E:-18,N:56,w:36,d:24,h:17,rh:11,rot:0.05,dach:[96,98,104],wand:[238,234,222],licht:0.3,form:'walm',name:'neuesSchloss'});
  HAEUSER.push({E:10,N:74,w:18,d:12,h:10,rh:7,rot:0.05,dach:[96,98,104],wand:[240,236,226],licht:0.9,form:'sattel',turm:{h:26,r:3},name:'kapelle'});
  HAEUSER.push({E:-62,N:-30,w:110,d:26,h:18,rh:11,rot:Math.PI/2,dach:F.kloDach,wand:F.gelb,licht:0.25,form:'walm',name:'kloster'});
  HAEUSER.push({E:-30,N:-88,w:70,d:22,h:16,rh:10,rot:0,dach:F.kloDach,wand:F.gelb,licht:0.35,form:'walm',name:'klosterFluegel'});
  for(let i=HAEUSER.length-1;i>=0;i--)if(HAEUSER[i].N>150&&!HAEUSER[i].name)HAEUSER.splice(i,1);
  for(const h of HAEUSER){const k=0.72;h.w*=k;h.d*=k;h.h*=k;h.rh*=k;h.E*=0.85;h.N*=0.85;if(h.turm)h.turm.h*=0.8;}
  // Dörfer: Niederaudorf, Erl, Kiefersfelden, Ebbs
  const dorf=(E0,E1,N0,N1,n,k,m)=>{for(let i=0;i<n*4&&n>0;i++){const E=E0+r()*(E1-E0),N=N0+r()*(N1-N0);if(Math.abs(E-innE(N))<INN_B+16||Math.abs(E-a93E(N))<20)continue;if(!frei(E,N,m))continue;haus(E,N,r,k);n--;}};
  dorf(-80,60,-90,30,5,1,34);dorf(-200,40,-360,-140,22,1,32);dorf(200,420,-640,-380,20,1,32);dorf(-60,60,-860,-560,18,1,32);
  for(let i=0,n=14;i<120&&n>0;i++){const E=-20+r()*220,N=-1000-r()*260;if(Math.abs(E-innE(N))<INN_B+14||Math.abs(E-a93E(N))<18||Math.abs(E-bahnE(N))<12||Math.hypot((E-FEST.E)/FEST.rE,(N-FEST.N)/FEST.rN)<1.15||E<westFuss(N)+30||!frei(E,N,26))continue;haus(E,N,r,1);n--;} // Kufstein
  for(let i=0;i<22;i++){const E=-560+r()*900,N=800-r()*1800;if(E>ostFuss(N)-30||E<waldRand(N)+10||Math.abs(E-innE(N))<INN_B+20||Math.abs(E-a93E(N))<24||inDorf(E,N))continue;if(tief(E,N)>520&&frei(E,N,70))haus(E,N,r,1.1);}
  for(let i=HAEUSER.length-1;i>=0;i--)if(HAEUSER[i].N>130&&!HAEUSER[i].name)HAEUSER.splice(i,1);}
// Erl: altes Passionsspielhaus (weiße geschwungene Wand) und neues Festspielhaus (schwarzer Keil)
const ERL={pass:{E:240,N:160,r:40},fest:{E:268,N:84}};
// Kirchen mit Zwiebelturm
const KIRCHEN=[{E:-88,N:-17,turm:38,w:9,zwiebel:true},{E:310,N:-500,turm:30,w:7,zwiebel:false}];
// Bäume
const BAEUME=[];{const r=rng(5);const rund=(E,N,k=1)=>{k*=0.62;BAEUME.push({E,N,t:0,r:(7+r()*5)*k,h:(16+r()*8)*k,v:r()});},fi=(E,N,k=1)=>{k*=0.62;BAEUME.push({E,N,t:1,b:(5+r()*3)*k,h:(24+r()*16)*k,v:r()});};
  for(let N=340;N>-1300;N-=20+r()*26){const e=innE(N);if(r()<0.8)rund(e-INN_B-6-r()*8,N);if(r()<0.85)rund(e+INN_B+6+r()*10,N);}
  for(let N=340;N>-1300;N-=40+r()*50)rund(a93E(N)-14-r()*4,N,0.85);
  for(const [E,N] of [[22,-26],[30,30],[-8,28],[-34,10],[60,-24],[-20,-14],[70,30],[-40,40],[34,60],[-60,70]])rund((E+r()*6)*0.85,(N+r()*6)*0.85,1.05); // Obstwiesen um Waller und Schlösser
  for(let i=0;i<380;i++){const E=-860+r()*1260,N=880-r()*1940;if(N<zahmFuss(E)+8||Math.hypot(E-250,N-120)<80||E<waldRand(N)+6||E>ostFuss(N)-8||Math.abs(E-innE(N))<INN_B+5||Math.abs(E-a93E(N))<16||HAEUSER.some(h=>Math.hypot(h.E-E,h.N-N)<28))continue;r()<0.72?rund(E,N,0.9):fi(E,N,0.9);}
  for(let i=0;i<200;i++){const N=950-r()*1280,E=ostFuss(N)-4-r()*30;fi(E,N,1.1);}
  for(const [cE,cN] of [[-250,420],[-120,-420],[-300,-150],[40,-760],[200,-480],[-200,620],[-560,-200],[-640,300],[-480,-600],[-720,-20]])for(let k=0;k<22;k++){const a=r()*TAU,d=Math.sqrt(r())*55,E=cE+Math.cos(a)*d*1.4,N=cN+Math.sin(a)*d;if(Math.abs(E-innE(N))<INN_B+8||Math.abs(E-a93E(N))<16||N<zahmFuss(E)||E<waldRand(N)+6)continue;fi(E,N,1);} // Waldrand am Gegenhang
  for(let i=0;i<560;i++){const N=700-r()*1660,E=westFuss(N)+4+r()*(waldRand(N)-westFuss(N)+4);fi(E,N,1.1);}
  for(let N=700;N>-960;N-=9+r()*14){const E=waldRand(N)+r()*8;r()<0.55?rund(E,N,0.95):fi(E,N,1);}}

// Berge als Facetten: entlang einer Grundlinie A→B, Reihen mit Versatz (in den Berg hinein) und Höhe
function massiv(A,B,rows,seed,dichte,typ){const r=rng(seed),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;let px=-uy,py=ux;if(rows.richtung<0){px=-px;py=-py;}
  const ts=[];for(let t=0;t<=L;t+=dichte*(0.6+r()*0.8))ts.push(t);ts.push(L);const off=ts.map(()=>(r()-0.5));
  const P=rows.map((f,j)=>ts.map((t,i)=>{const [o,h]=f(t/L,i,off[i],r);return [A[0]+ux*t+px*o,A[1]+uy*t+py*o,h];}));const tris=[];
  for(let j=0;j<P.length-1;j++)for(let i=0;i<ts.length-1;i++){const a=P[j][i],b=P[j][i+1],c=P[j+1][i],d=P[j+1][i+1];for(const tr of [[a,b,c],[b,d,c]]){
    const v1=[tr[1][0]-tr[0][0],tr[1][1]-tr[0][1],tr[1][2]-tr[0][2]],v2=[tr[2][0]-tr[0][0],tr[2][1]-tr[0][1],tr[2][2]-tr[0][2]];let n=[v1[1]*v2[2]-v1[2]*v2[1],v1[2]*v2[0]-v1[0]*v2[2],v1[0]*v2[1]-v1[1]*v2[0]];if(n[2]<0)n=n.map(x=>-x);const l=Math.hypot(...n)||1;
    const c0=[(tr[0][0]+tr[1][0]+tr[2][0])/3,(tr[0][1]+tr[1][1]+tr[2][1])/3,(tr[0][2]+tr[1][2]+tr[2][2])/3];tris.push({t:tr,n:n.map(x=>x/l),c:c0,typ:typ(j,c0[2],c0),v:r()});}}return tris;}
const BERGE=(()=>{const T=[];const env=(t,a,b)=>smooth(0,a,t)*(1-smooth(b,1,t));
  // Erler Berge links (Tirol, bewaldet, Richtung Kranzhorn)
  {const prof=t=>170+110*Math.exp(-(((t-0.22)/0.13)**2))+80*Math.exp(-(((t-0.58)/0.1)**2))+40*Math.sin(t*9);
   const R=[(t,i,o)=>[0,0],(t,i,o)=>[34+o*30,prof(t)*0.25+o*14],(t,i,o)=>[80+o*40,prof(t)*0.5+o*22],(t,i,o)=>[130+o*44,prof(t)*0.75+o*24],(t,i,o)=>[190+o*30,prof(t)*(0.75+0.25*env(t,0.05,0.85))+o*20]];
   const Rs=R.map(f=>(t,i,o,r)=>{const q=f(t,i,o,r),N=950-t*1280;return [q[0]+ostFuss(N)-318,q[1]];});T.push(...massiv([318,950],[318,-330],Rs,21,42,(j,h)=>'wald'));}
  // ferne Hügel im Kaiserwinkl, zwischen Erler Bergen und Kaiser
  {const R=[(t,i,o)=>[0,60],(t,i,o)=>[80,200+50*Math.sin(t*3)+o*30],(t,i,o)=>[160,280+40*Math.sin(t*2)+o*30]];T.push(...massiv([700,400],[1600,-560],R,24,90,(j,h)=>'wald').map(f=>(f.fern=2,f)));}
  // Zahmer Kaiser: breite Nordwand; zum Westende (Kufstein) läuft er flach und schmal aus
  {const rq=rng(61),RH=[];for(let k=0;k<90;k++)RH.push((rq()-0.5)*44);const w=t=>0.35+0.65*env(t,0.12,0.9),hk=t=>0.04+0.96*env(t,0.24,0.8)**0.8;
   const Hz=(t,i)=>(400+80*Math.sin(t*Math.PI*1.1)+22*Math.sin(t*37+0.5)+12*Math.sin(t*83))*hk(t),oz=(t,j)=>0.6*Math.sin(t*31+j*1.7)+0.4*Math.sin(t*13+j);
   const R=[[0,0],[50,0.2],[96,0.4],[134,0.58],[166,0.74],[192,0.87],[212,0.96],[228,1],[262,0.9]].map(([a,f],j)=>(t,i,o)=>[(a+(j?oz(t,j)*8:0))*w(t),f*Hz(t,i)+(j&&f<1?oz(t*1.4,j+3)*8:0)]);R.richtung=-1;
   T.push(...massiv([200,-960],[760,-620],R,43,32,(j,h,c)=>{const th=255+60*rau(c[0],c[1]);return h>th+30?'fels':h>th-30?'mix':'wald';}));}
  // Wilder Kaiser: dahinter, unregelmäßige Türme

const lVon=(y,m,d,h=0,mi=0,s=0)=>{const lok=new Date(y,m,d,h,mi,s).getTime();return lok-bzVers(lok-bzVers(lok));}; // Berliner Uhrzeit -> echte Zeit
const lUrlJetzt=()=>SIM_URL?SIM_URL.at+(Date.now()-SIM_URL.dev)*SIM_URL.k:echtJetzt();
// Werte für das Bild: Szene, darüber die Wetter-Stufe, darüber die Jahreszeit (gleiche Namen wie die Testschalter in der Adresse)
function lWerte(){const p={};if(LS.szene){const D=L_SZ[LS.di];for(const k in D)if(k!=='n'&&k!=='t'&&k!=='k')p[k==='w'?'wetter':k]=D[k];if(D.t&&p.wetter===undefined&&LEISTE_CFG.szeneWetter)p.wetter=LEISTE_CFG.szeneWetter;}
  Object.assign(p,L_WE[LS.ws].p||{},L_JZ[LS.js].p||{});LEISTE_CFG.setzen(p);}
// Zeit für das Bild: Datum der Szene (sonst heute), von der Jahreszeit verschoben; Uhrzeit der Szene oder die gerade gezeigte; Zeitraffer ab 0:00 in Schleife
function lZeit(art){const D=LS.szene&&L_SZ[LS.di].t?L_SZ[LS.di]:null,J=L_JZ[LS.js],tD=D?parseT(D.t):null,basis=berlin(D?tD:lUrlJetzt());
  if(!LS.zr&&!D&&!J.monat){SIM=SIM_URL;return;} // nichts verstellt: live (oder die Zeit aus der Adresse)
  const z=berlin(art==='szene'?(D?tD:lUrlJetzt()):jetzt()),sek=art==='zr'?0:z.getHours()*3600+z.getMinutes()*60+z.getSeconds();
  let y=basis.getFullYear(),m=basis.getMonth(),d=basis.getDate();if(J.monat){if(m>J.monat-1)y++;m=J.monat-1;d=J.tag||15;}
  if(LS.zr){const a=lVon(y,m,d);SIM={tag0:a,at:a+sek*1000,dev:Date.now(),k:LEISTE_CFG.zeitraffer||480,schleife:lVon(y,m,d+1)-a};return;}
  SIM={at:lVon(y,m,d,Math.floor(sek/3600),Math.floor(sek/60)%60,sek%60),dev:Date.now(),k:D?D.k||1:1};}
function lSzene(r){LS.di=(LS.di+r+L_SZ.length)%L_SZ.length;LS.szene=true;LS.ws=0;LS.js=0;LS.zr=false;lWerte();lZeit('szene');}
function lLive(){LS.di=0;LS.szene=false;LS.ws=0;LS.js=0;LS.zr=false;lWerte();SIM=SIM_URL;}
const L_KN=[{txt:()=>'◀ Szene',f:()=>lSzene(-1)},{txt:()=>'Szene ▶',f:()=>lSzene(1)},
  {txt:()=>LS.zr?'Zeitraffer aus':'Tag im Zeitraffer',an:()=>LS.zr,f:()=>{LS.zr=!LS.zr;lZeit(LS.zr?'zr':'halt');}},
  {klein:'Wetter',txt:()=>L_WE[LS.ws].n,an:()=>LS.ws>0,f:()=>{LS.ws=(LS.ws+1)%L_WE.length;lWerte();}},
  {klein:'Jahreszeit',txt:()=>L_JZ[LS.js].n,an:()=>LS.js>0,f:()=>{LS.js=(LS.js+1)%L_JZ.length;lWerte();lZeit('saison');}},
  {txt:()=>'Live',f:lLive}];
const lZustand=()=>({di:LS.di,szene:LS.szene,ws:LS.ws,js:LS.js,zr:LS.zr,wahl:LS.wahl,SIM});
function lHerstellen(z){Object.assign(LS,{di:z.di,szene:z.szene,ws:z.ws,js:z.js,zr:z.zr,wahl:z.wahl});SIM=z.SIM;lWerte();}
function lText(){const d=berlin(jetzt()),h=berlin(echtJetzt()),T=[];
  if(LS.szene)T.push('Szene '+(LS.di+1)+'/'+L_SZ.length+' · '+L_SZ[LS.di].n);if(LS.zr)T.push('Zeitraffer');if(LS.js)T.push(L_JZ[LS.js].n);if(LS.ws)T.push(L_WE[LS.ws].n);
  if(!T.length)T.push(SIM?'Zeit aus der Adresse':'Live');
  const gleich=d.getFullYear()===h.getFullYear()&&d.getMonth()===h.getMonth()&&d.getDate()===h.getDate();
  T.push((gleich?'':L_WT[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'+(d.getFullYear()!==h.getFullYear()?d.getFullYear():'')+' ')+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
  return T.join(' · ');}
function lMass(){document.documentElement.style.setProperty('--lu',Math.min(innerWidth,innerHeight*W/H)/100+'px');} // 1 % der Bildbreite
function lBauen(){const st=document.createElement('style');
  st.textContent='#leiste{position:fixed;left:50%;bottom:calc(var(--lu)*3);transform:translateX(-50%);width:calc(var(--lu)*94);box-sizing:border-box;padding:calc(var(--lu)*2.2) calc(var(--lu)*2.2) calc(var(--lu)*2.4);'+
    'background:rgba(16,22,30,.6);border-radius:calc(var(--lu)*2.6);color:#f4efe6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;cursor:default;z-index:5}'+
    '#leiste .l-info{font-weight:600;font-size:calc(var(--lu)*3.4);line-height:1.25;text-align:center;margin-bottom:calc(var(--lu)*.6)}'+
    '#leiste .l-taste{font-size:calc(var(--lu)*2.1);color:rgba(244,239,230,.62);text-align:center;margin-bottom:calc(var(--lu)*1.8)}'+
    '#leiste .l-kn{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--lu)*1.6)}'+
    '#leiste button{appearance:none;border:calc(var(--lu)*.45) solid transparent;background:rgba(255,255,255,.1);color:#f4efe6;font:600 calc(var(--lu)*3.3)/1.15 system-ui,-apple-system,"Segoe UI",sans-serif;'+
    'padding:calc(var(--lu)*1.7) calc(var(--lu)*1);border-radius:calc(var(--lu)*1.6);cursor:pointer;outline:none;transition:transform .12s,background .12s}'+
    '#leiste button small{display:block;font-size:.62em;font-weight:500;opacity:.7;margin-bottom:.15em}'+
    '#leiste button.an{color:#ffd27a}'+
    '#leiste button.wahl{background:#fff7e0;color:#14171d;border-color:#ffc23d;transform:scale(1.07);box-shadow:0 0 0 calc(var(--lu)*.7) rgba(255,194,61,.5),0 0 calc(var(--lu)*4) rgba(255,214,120,.7)}'+
    '#leiste button.wahl small{opacity:.75}';
  document.head.appendChild(st);const el=document.createElement('div');el.id='leiste';el.innerHTML='<div class="l-info"></div><div class="l-taste"></div><div class="l-kn"></div>';
  L_KN.forEach((b,i)=>{const x=document.createElement('button');x.type='button';x.tabIndex=-1;x.onclick=()=>{LS.zuletzt=Date.now();LS.wahl=i;b.f();lAnzeigen();lFokus();};el.lastChild.appendChild(x);b.el=x;b.k='';});
  document.body.appendChild(el);LS.el=el;lMass();addEventListener('resize',lMass);}
function lAnzeigen(){if(!LS.auf)return;const t=lText();if(t!==LS.txt){LS.txt=t;LS.el.firstChild.textContent=t;}
  const k='Zuletzt empfangen: '+(LS.taste||'–')+'  ·  ◀ ▶ wählen, OK drücken, ▲ ▼ Szenen, 3× OK schließt';if(LS.el.children[1].textContent!==k)LS.el.children[1].textContent=k;
  L_KN.forEach((b,i)=>{const x=b.txt(),c=(i===LS.wahl?'wahl ':'')+(b.an&&b.an()?'an':'');if(b.k!==x+c){b.k=x+c;b.el.className=c.trim();b.el.innerHTML=(b.klein?'<small>'+b.klein+'</small>':'')+x;}});}
function lAuf(){if(!LS.el)lBauen();LS.auf=true;LS.el.style.display='';LS.zuletzt=Date.now();lAnzeigen();}
function lZu(){LS.auf=false;if(LS.el)LS.el.style.display='none';}
addEventListener('keydown',e=>{const a=TASTE(e);LS.taste=(e.key===' '?'Leertaste':e.key||'?')+' (keyCode '+(e.keyCode||e.which||0)+')';LS.zuletzt=Date.now();if(!a){lAnzeigen();return;}e.preventDefault();
  if(a==='ok'){if(e.repeat)return;const n=performance.now();LS.ok=LS.ok.filter(x=>n-x<1500);LS.rueck=LS.rueck.filter(x=>n-x.t<1500);
    if(LS.ok.length>=2){const r=LS.rueck.find(x=>x.t===LS.ok[0]);LS.ok=[];LS.rueck=[];if(LS.auf){if(r)lHerstellen(r.z);lZu();}else lAuf();return;}
    LS.ok.push(n);if(LS.auf){LS.rueck.push({t:n,z:lZustand()});L_KN[LS.wahl].f();}lAnzeigen();return;}
  if(!LS.auf)return;
  if(a==='links'||a==='rechts')LS.wahl=(LS.wahl+(a==='rechts'?1:L_KN.length-1))%L_KN.length;else lSzene(a==='hoch'?1:-1);lAnzeigen();},true);
setInterval(()=>{if((LS.auf||LS.szene||LS.ws||LS.js||LS.zr)&&Date.now()-LS.zuletzt>6e5){lLive();lZu();}lAnzeigen();},500);
// Tasten kommen nur an, wenn die Seite den Fokus hat: Bild fokussierbar machen und beim Laden, Zurückkehren und Antippen fokussieren
cv.tabIndex=0;cv.style.outline='none';function lFokus(){try{if(document.activeElement!==cv)cv.focus({preventScroll:true});}catch(e){}}
lFokus();addEventListener('load',lFokus);addEventListener('pageshow',lFokus);addEventListener('focus',lFokus);addEventListener('pointerup',lFokus);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lFokus();});
{const v=Q.get('demo');if(v!==null&&!['0','nein','false'].includes(v)){lAuf();const n=parseInt(v,10);if(n>1&&n<=L_SZ.length){LS.di=n-2;lSzene(1);lAnzeigen();}}}
let LETZT=0;function loop(q){requestAnimationFrame(loop);if(q!==undefined&&q-LETZT<30)return;LETZT=q||0;const a=performance.now();bild(jetzt());if(DEV)fpsZeigen(q||a,performance.now()-a);}loop();
</script></body></html>
